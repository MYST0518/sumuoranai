name: Sumu 𝕏 Cloud Auto Post

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow requests
          python -m playwright install chromium

      - name: Run Auto Post Script
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: |
          python auto_post.py


      - name: Upload Error Screenshot and Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-and-logs
          path: |
            *.png
            *.txt
            *.log

      - name: Commit and push updated Obsidian stock notes
        if: success()
        run: |
          git config --global user.name "Sumu Auto Poster Bot"
          git config --global user.email "bot@sumu-fortune.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto Post: Update Obsidian stock status [skip ci]"
          git push
